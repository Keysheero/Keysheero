<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Kirill Belyakov — Python backend developer</title><desc id="desc">Based in Almaty, Kazakhstan. The illustration follows a request through a Python service to storage. It is decorative, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eff4e9}.muted{fill:#a8b8aa}.accent{fill:#c7ed95}.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.bold{font-weight:700;letter-spacing:-1px}.rule{fill:none;stroke:#33473a}.panel{fill:#17241e;stroke:#33473a}.moving{animation:travel 9s linear infinite}.stage{animation:stage 9s ease-in-out infinite}.s1{animation-delay:3s}.s2{animation-delay:6s}@keyframes travel{0%{stroke-dashoffset:35;opacity:0}8%{opacity:1}87%{opacity:1}100%{stroke-dashoffset:-434;opacity:0}}@keyframes stage{0%,32%,100%{opacity:0}10%,23%{opacity:.9}}@media(prefers-reduced-motion:reduce){.moving,.stage{animation:none!important}.moving{display:none!important}.stage{opacity:0!important}}</style><rect x=".5" y=".5" width="599" height="329" rx="16" fill="#101916" stroke="#33473a"/><text x="30" y="39" font-size="18" class="mono muted" >KEYSHEERO</text><text x="30" y="99" font-size="47" class="bold" >Kirill Belyakov</text><text x="30" y="139" font-size="25" class="" >Python backend developer</text><text x="30" y="174" font-size="19" class="muted" >Almaty, Kazakhstan</text><path d="M98 242H502" stroke="#33473a" stroke-width="2"/><path class="moving" d="M98 242H502" fill="none" stroke="#c7ed95" stroke-width="2" stroke-dasharray="30 404"/><rect x="70" y="214" width="56" height="56" rx="15" class="panel"/><rect x="70" y="214" width="56" height="56" rx="15" fill="none" stroke="#c7ed95" class="stage s0" opacity="0"/><g fill="none" stroke="#c7ed95" stroke-width="1.6"><path d="m88 242 7-7m-7 7 7 7m13-14 7 7-7 7"/></g><text x="98" y="301" font-size="15" class="mono muted" text-anchor="mid