<svg xmlns="http://www.w3.org/2000/svg" width="600" height="414" viewBox="0 0 600 414" role="img" aria-labelledby="title desc"><title id="title">SchoolPro request flow</title><desc id="desc">A Telegram event passes through role middleware with Redis caching, domain services, and SQLAlchemy to PostgreSQL. This is an architectural illustration, not live traffic.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1b3022}.muted{fill:#52644f}.accent{fill:#426b2d}.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.bold{font-weight:700;letter-spacing:-1px}.rule{fill:none;stroke:#cbd6c2}.panel{fill:#eaf0e2;stroke:#cbd6c2}.stage{animation:step 12s ease-in-out infinite}.s1{animation-delay:3s}.s2{animation-delay:6s}.s3{animation-delay:9s}.moving{animation:packet 12s ease-in-out infinite}@keyframes step{0%,25%,100%{opacity:0}7%,18%{opacity:1}}@keyframes packet{0%,15%{transform:translateY(0px);opacity:1}25%,40%{transform:translateY(76px);opacity:1}50%,65%{transform:translateY(152px);opacity:1}75%,93%{transform:translateY(228px);opacity:1}99.9%{transform:translateY(228px);opacity:0}100%{transform:translateY(0px);opacity:0}}@media(prefers-reduced-motion:reduce){.moving,.stage{animation:none!important}.moving{display:none!important}.stage{opacity:0!important}}</style><rect x=".5" y=".5" width="599" height="413" rx="16" fill="#f5f8ef" stroke="#cbd6c2"/><text x="28" y="36" font-size="18" class="mono muted" >SCHOOLPRO / REQUEST FLOW</text><rect x="76" y="64" width="496" height="60" rx="10" class="panel"/><rect x="76" y="64" width="496" height="60" rx="10" fill="none" stroke="#426b2d" class="stage s0" opacity="0"/><text x="92" y="89" font-size="22" class="" >Telegram event</text><text x="92" y="112" font-size="17" class="muted" >aiogram / asyncio</text><path d="M38 94v76" class="rule" stroke-width="2"/><circle cx="38" cy="94" r="5" fill="#426b2d"/><rect x="76" y="140" width="496" height="60" rx="10" class="panel"/><rect x="76" y="140" width="496" height="60" rx="10" fill="none" stroke="#426b2d" class="stage s1" opacity="0"/><text x="92" y="165" font-size="22" class="" >Role middleware</text><text x="92" y="188" font-size="17" class="muted" >Redis role cache</text><path d="M38 170v76" class="rule" stroke-width="2"/><circle cx="38" cy="170" r="5" fill="#426b2d"/><rect x="76" y="216" width="496" height="60" rx="10" class="panel"/><rect x="76" y="216" width="496" height="60" rx="10" fill="none" stroke="#426b2d" class="stage s2" opacity="0"/><text x="92" y="241" font-size="22" class="" >Domain services</text><text x="92" y="264" font-size="17" class="muted" >Homework, quizzes, progress</text><path d="M38 246v76" class="rule" stroke-width="2"/><circle cx="38" cy="246" r="5" fill="#426b2d"/><rect x="76" y="292" width="496" height="60" rx="10" class="panel"/><rect x="76" y="292" width="496" height="60" rx="10" fill="none" stroke="#426b2d" class="stage s3" opacity="0"/><text x="92" y="317" font-size="22" class="" >PostgreSQL</text><text x="92" y="340" font-size="17" class="muted" >SQLAlchemy / async access</text><circle cx="38" cy="322" r="5" fill="#426b2d"/><circle class="moving" cx="38" cy="94" r="7" fill="#426b2d"/><text x="28" y="396" font-size="15" class="muted" >Illustrated sequence · not live traffic</text></svg>
