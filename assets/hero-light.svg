<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc"><title id="title">Kirill Belyakov — Python backend developer</title><desc id="desc">Based in Almaty, Kazakhstan. The illustration follows a request through a Python service to storage. It is decorative, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1b3022}.muted{fill:#52644f}.accent{fill:#426b2d}.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.bold{font-weight:700;letter-spacing:-1px}.rule{fill:none;stroke:#cbd6c2}.panel{fill:#eaf0e2;stroke:#cbd6c2}.moving{animation:travel 9s linear infinite}.stage{animation:stage 9s ease-in-out infinite}.s1{animation-delay:3s}.s2{animation-delay:6s}@keyframes travel{0%{stroke-dashoffset:35;opacity:0}8%{opacity:1}87%{opacity:1}100%{stroke-dashoffset:-346;opacity:0}}@keyframes stage{0%,32%,100%{opacity:0}10%,23%{opacity:.9}}@media(prefers-reduced-motion:reduce){.moving,.stage{animation:none!important}.moving{display:none!important}.stage{opacity:0!important}}</style><rect x=".5" y=".5" width="999" height="259" rx="16" fill="#f5f8ef" stroke="#cbd6c2"/><text x="38" y="37" font-size="13" class="mono muted" >KEYSHEERO</text><text x="38" y="101" font-size="54" class="bold" >Kirill Belyakov</text><text x="38" y="142" font-size="24" class="" >Python backend developer</text><text x="38" y="210" font-size="16" class="muted" >Almaty, Kazakhstan</text><path class="rule" d="M38 173H487"/><path d="M622 118H938" stroke="#cbd6c2" stroke-width="2"/><path class="moving" d="M622 118H938" fill="none" stroke="#426b2d" stroke-width="2" stroke-dasharray="30 316"/><rect x="594" y="90" width="56" height="56" rx="15" class="panel"/><rect x="594" y="90" width="56" height="56" rx="15" fill="none" stroke="#426b2d" class="stage s0" opacity="0"/><g fill="none" stroke="#426b2d" stroke-width="1.6"><path d="m612 118 7-7m-7 7 7 7m13-14 7 7-7 7"/></g><text x="622" y="177" font-size="12" class="mono muted" text-anchor="middle">REQUEST</text><rect x="752" y="90" width="56" height="56" rx="15" class="panel"/><rect x="752" y="90" width="56" height="56" rx="15" fill="none" stroke="#426b2d" class="stage s1" opacity="0"/><text x="780" y="125" font-size="23" class="mono accent" text-anchor="middle">{ }</text><text x="780" y="177" font-size="12" class="mono muted" text-anchor="middle">PYTHON</text><rect x="910" y="90" width="56" height="56" rx="15" class="panel"/><rect x="910" y="90" width="56" height="56" rx="15" fill="none" stroke="#426b2d" class="stage s2" opacity="0"/><g fill="none" stroke="#426b2d" stroke-width="1.6"><ellipse cx="938" cy="110" rx="11" ry="4"/><path d="M927 110v16c0 6 22 6 22 0v-16M927 118c0 6 22 6 22 0"/></g><text x="938" y="177" font-size="12" class="mono muted" text-anchor="middle">DATA</text><text x="610" y="37" font-size="12" class="mono muted" >BACKEND / ASYNC</text><text x="780" y="210" font-size="13" class="muted" text-anchor="middle">request → service → storage</text></svg>
