<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title desc"><title id="title">SchoolPro request flow</title><desc id="desc">A Telegram event passes through role middleware with Redis caching, domain services, and SQLAlchemy to PostgreSQL. This is an architectural illustration, not live traffic.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eff4e9}.muted{fill:#a8b8aa}.accent{fill:#c7ed95}.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.bold{font-weight:700;letter-spacing:-1px}.rule{fill:none;stroke:#33473a}.panel{fill:#17241e;stroke:#33473a}.stage{animation:step 12s ease-in-out infinite}.s1{animation-delay:3s}.s2{animation-delay:6s}.s3{animation-delay:9s}.moving{animation:packet 12s ease-in-out infinite}@keyframes step{0%,25%,100%{opacity:0}7%,18%{opacity:1}}@keyframes packet{0%,15%{transform:translateX(0px);opacity:1}25%,40%{transform:translateX(245px);opacity:1}50%,65%{transform:translateX(490px);opacity:1}75%,93%{transform:translateX(735px);opacity:1}99.9%{transform:translateX(735px);opacity:0}100%{transform:translateX(0px);opacity:0}}@media(prefers-reduced-motion:reduce){.moving,.stage{animation:none!important}.moving{display:none!important}.stage{opacity:0!important}}</style><rect x=".5" y=".5" width="999" height="245" rx="16" fill="#101916" stroke="#33473a"/><text x="28" y="36" font-size="13" class="mono muted" >SCHOOLPRO / REQUEST FLOW</text><rect x="28" y="73" width="209" height="104" rx="10" class="panel"/><rect x="28" y="73" width="209" height="104" rx="10" fill="none" stroke="#c7ed95" class="stage s0" opacity="0"/><text x="44" y="115" font-size="20" class="" >Telegram event</text><text x="44" y="147" font-size="13" class="muted" >aiogram / asyncio</text><path d="M244 125h17m-5-4 5 4-5 4" fill="none" stroke="#6e9650" stroke-width="1.5"/><rect x="273" y="73" width="209" height="104" rx="10" class="panel"/><rect x="273" y="73" width="209" height="104" rx="10" fill="none" stroke="#c7ed95" class="stage s1" opacity="0"/><text x="289" y="115" font-size="20" class="" >Role middleware</text><text x="289" y="147" font-size="13" class="muted" >Redis role cache</text><path d="M489 125h17m-5-4 5 4-5 4" fill="none" stroke="#6e9650" stroke-width="1.5"/><rect x="518" y="73" width="209" height="104" rx="10" class="panel"/><rect x="518" y="73" width="209" height="104" rx="10" fill="none" stroke="#c7ed95" class="stage s2" opacity="0"/><text x="534" y="115" font-size="20" class="" >Domain services</text><text x="534" y="147" font-size="13" class="muted" >Homework, quizzes, progress</text><path d="M734 125h17m-5-4 5 4-5 4" fill="none" stroke="#6e9650" stroke-width="1.5"/><rect x="763" y="73" width="209" height="104" rx="10" class="panel"/><rect x="763" y="73" width="209" height="104" rx="10" fill="none" stroke="#c7ed95" class="stage s3" opacity="0"/><text x="779" y="115" font-size="20" class="" >PostgreSQL</text><text x="779" y="147" font-size="13" class="muted" >SQLAlchemy / async access</text><path d="M132 200H867" class="rule" stroke-width="2"/><circle class="moving" cx="132" cy="200" r="4" fill="#c7ed95"/><text x="28" y="228" font-size="12" class="muted" >Illustrated sequence · not live traffic</text></svg>
