<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title desc"><title id="title">SchoolPro request flow</title><desc id="desc">A Telegram event passes through role middleware with Redis caching, domain services, and SQLAlchemy to PostgreSQL. This is an architectural illustration, not live traffic.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1b3022}.muted{fill:#52644f}.accent{fill:#426b2d}.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:1px}.bold{font-weight:700;letter-spacing:-1px}.rule{fill:none;stroke:#cbd6c2}.panel{fill:#eaf0e2;stroke:#cbd6c2}@media(prefers-reduced-motion:reduce){.moving,.stage{animation:none!important}.moving{display:none!important}.stage{opacity:0!important}}</style><rect x=".5" y=".5" width="999" height="245" rx="16" fill="#f5f8ef" stroke="#cbd6c2"/><text x="28" y="36" font-size="13" class="mono muted" >SCHOOLPRO / REQUEST FLOW</text><rect x="28" y="73" width="209" height="104" rx="10" class="panel"/><text x="44" y="115" font-size="20" class="" >Telegram event</text><text x="44" y="147" font-size="13" class="muted" >aiogram / asyncio</text><path d="M244 125h17m-5-4 5 4-5 4" fill="none" stroke="#8da96d" stroke-width="1.5"/><rect x="273" y="73" width="209" height="104" rx="10" class="panel"/><text x="289" y="115" font-size="20" class="" >Role middleware</text><text x="289" y="147" font-size="13" class="muted" >Redis role cache</text><path d="M489 125h17m-5-4 5 4-5 4" fill="none" stroke="#8da96d" stroke-width="1.5"/><rect x="518" y="73" width="209" height="104" rx="10" class="panel"/><text x="534" y="115" font-size="20" class="" >Domain services</text><text x="534" y="147" font-size="13" class="muted" >Homework, quizzes, progress</text><path d="M734 125h17m-5-4 5 4-5 4" fill="none" stroke="#8da96d" stroke-width="1.5"/><rect x="763" y="73" width="209" height="104" rx="10" class="panel"/><text x="779" y="115" font-size="20" class="" >PostgreSQL</text><text x="779" y="147" font-size="13" class="muted" >SQLAlchemy / async access</text><path d="M132 200H867" class="rule" stroke-width="2"/><text x="28" y="228" font-size="12" class="muted" >Illustrated sequence · not live traffic</text></svg>
