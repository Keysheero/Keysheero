name: Refresh profile activity

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check calendar parser
        run: node --test scripts/activity.test.cjs
      - name: Read public activity and build artwork
        run: |
          node scripts/update-activity.cjs
          node scripts/build-assets.cjs
          node scripts/build-static-profile.cjs
          node scripts/check-profile.cjs
      - name: Commit changed profile files
        run: |
          git add README.md PROFILE-STATIC.md assets/ data/activity.json
          if git diff --cached --quiet; then
            echo "Activity is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public GitHub activity"
          git push origin HEAD:main
