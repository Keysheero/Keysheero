<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="Kirill Belyakov — Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1622"/>
      <stop offset="55%"  stop-color="#132b47"/>
      <stop offset="100%" stop-color="#1c3f6e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#4da3ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#4da3ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="round">
      <rect x="0" y="0" width="880" height="210" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="880" height="210" fill="url(#bg)"/>
    <rect width="880" height="210" fill="url(#grid)"/>
    <ellipse cx="742" cy="96" rx="210" ry="150" fill="url(#glow)"/>

    <g stroke="#6fb6ff" stroke-opacity="0.30" stroke-width="1.1" fill="none">
      <path d="M648 62 L716 96 L648 130"/>
      <path d="M716 96 L800 62"/>
      <path d="M716 96 L800 130"/>
      <path d="M800 62 L800 130"/>
      <path d="M648 62 L648 130"/>
    </g>
    <g fill="#8ec7ff">
      <circle cx="648" cy="62"  r="4.5" fill-opacity="0.85"/>
      <circle cx="648" cy="130" r="4.5" fill-opacity="0.85"/>
      <circle cx="716" cy="96"  r="6.5" fill-opacity="1"/>
      <circle cx="800" cy="62"  r="4.5" fill-opacity="0.7"/>
      <circle cx="800" cy="130" r="4.5" fill-opacity="0.7"/>
    </g>

    <text x="56" y="86"
          font-family="'Segoe UI Semibold','Segoe UI',Helvetica,Arial,sans-serif"
          font-size="42" font-weight="600" letter-spacing="1.4" fill="#ffffff">
      Kirill Belyakov
    </text>

    <rect x="58" y="102" width="118" height="2.5" rx="1.25" fill="url(#accent)"/>

    <text x="56" y="132"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="17" font-weight="500" letter-spacing="0.4" fill="#9ec5ef">
      Backend Developer · Python
    </text>

    <text x="56" y="160"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="13.5" letter-spacing="0.2" fill="#7d97b3">
      Production Telegram platforms · async services · the infrastructure underneath
    </text>

    <text x="56" y="184"
          font-family="'Consolas','SF Mono',Menlo,monospace"
          font-size="11.5" letter-spacing="0.6" fill="#5f7a97">
      Almaty, Kazakhstan  ·  open to relocation and remote
    </text>
  </g>
</svg>
